    <section class="counter" aria-label="{{counter.title}}" data-counter>
      <script type="application/json" data-sites>{{{sitesJson}}}</script>
      <div class="container counter-grid">
        <div class="stat">
          <p class="stat-value" data-counter-buildings>{{counter.buildings}}</p>
          <p class="stat-label">{{counter.buildingsLabel}}</p>
        </div>
        <div class="stat">
          <p class="stat-value" data-counter-points>{{counter.points}}</p>
          <p class="stat-label">{{counter.pointsLabel}}</p>
        </div>
        <div class="stat stat-wide">
          <p class="stat-value" data-counter-readings data-lang="{{lang}}">{{counter.readings}}</p>
          <p class="stat-label">{{counter.readingsLabel}} <button type="button" class="info" aria-label="{{counter.formula}}" data-tooltip="{{counter.formula}}">i</button></p>
        </div>
        <div class="stat">
          <p class="stat-value" data-counter-leaks>{{counter.leaks}}</p>
          <p class="stat-label">{{counter.leaksLabel}} <button type="button" class="info" aria-label="{{counter.leaksNote}}" data-tooltip="{{counter.leaksNote}}">i</button></p>
        </div>
      </div>
      <p class="container counter-note">{{counter.note}}</p>
    </section>
