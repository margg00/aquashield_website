    <section class="proof-strip" aria-label="{{proofStrip.title}}" data-proof>
      <div class="container">
      <ul class="proof-cells">
{{#each proofStrip.items}}        <li class="proof-cell">
          <p class="proof-label">{{label}}</p>
          {{#if to}}<p class="proof-value"><span class="proof-pair"><span class="proof-from">{{from}}</span><span class="proof-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="sr-only"> {{proofStrip.to}} </span><span class="proof-to">{{to}}</span></span></p>{{/if}}{{#unless to}}<p class="proof-value"{{#if count}} data-count{{/if}}>{{value}}</p>{{/unless}}
          <p class="proof-line">{{line}}</p>
        </li>
{{/each}}      </ul>
      </div>
    </section>
