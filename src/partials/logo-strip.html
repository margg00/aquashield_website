        <div class="logo-wall-groups logo-strip">
{{#each logoGroups}}          <div class="logo-wall-group">
            <p class="logo-label">{{label}}</p>
            <ul class="logo-wall">
{{#each items}}              <li>{{#if file}}<img class="logo-{{tone}}" src="{{base}}assets/img/logos/{{file}}" alt="{{name}}" style="height: {{height}}px" decoding="async">{{/if}}{{#unless file}}<span class="logo-word">{{name}}</span>{{/unless}}</li>
{{/each}}            </ul>
          </div>
{{/each}}        </div>
